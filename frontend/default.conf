server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    location /api/ {
        proxy_pass http://pktm-backend:3000/api/;
        proxy_set_header Host $host;
    }

    # NOUVEAU : On laisse Nginx rediriger les requêtes OIDC vers Node.js
    location /oidc/ {
        proxy_pass http://pktm-backend:3000/oidc/;
        proxy_set_header Host $host;
    }
}