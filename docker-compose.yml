services:
  pktm-frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  pktm-backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - pktm-bdd
    environment:
      - DB_HOST=pktm-bdd
      - DB_USER=pktm
      - DB_PASSWORD=124509
      - DB_NAME=pktmfr
      - HOST_PROC=/host/proc  # Indique à systeminformation où trouver le /proc hôte
    volumes:
      - /proc:/host/proc:ro  # Monte le /proc de la machine hôte en lecture seule

  pktm-bdd:
    image: postgres:16-alpine # Légère et nativement compatible ARM64
    restart: unless-stopped
    environment:
      POSTGRES_USER: pktm
      POSTGRES_PASSWORD: 124509
      POSTGRES_DB: pktmfr
    volumes:
      - db-data:/var/lib/postgresql/data # Persistance des données

volumes:
  db-data: # Déclaration du volume nommé